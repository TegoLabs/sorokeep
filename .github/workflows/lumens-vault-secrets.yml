name: Lumens Vault Secret Scanning

on:
  push:
    paths:
      - 'lumens-vault/**'
  pull_request:
    paths:
      - 'lumens-vault/**'

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for Stellar secret keys
        run: |
          python3 - <<'EOF'
          import os, re, sys
          pattern = re.compile(r'\bS[A-Z2-7]{55}\b')
          # Allowlist for dummy/fixture values (document why each is safe)
          allowlist = set()
          findings = []
          root = 'lumens-vault'
          for dirpath, _, filenames in os.walk(root):
              for fn in filenames:
                  fp = os.path.join(dirpath, fn)
                  try:
                      with open(fp, 'r', errors='ignore') as f:
                          for i, line in enumerate(f, 1):
                              for m in pattern.finditer(line):
                                  val = m.group(0)
                                  if val not in allowlist:
                                      findings.append(f"{fp}:{i}: {val[:8]}...")
                  except Exception:
                      pass
          if findings:
              print("Secret key findings:")
              for x in findings:
                  print(" ", x)
              print("\nIf these are real keys: rotate them immediately.")
              print("If these are test fixtures: add to allowlist with a comment.")
              sys.exit(1)
          print("No Stellar secret keys found. Clean.")
          EOF
