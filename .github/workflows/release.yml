name: Release & Publish

on:
  push:
    branches: [main]
  # A publish can fail after the tag and GitHub release already exist, which is
  # exactly what happened with v1.1.0. Without a manual trigger the only way to
  # retry is to delete the tag and release and re-push -- destructive surgery to
  # work around a missing button. This lets a tagged version be re-published.
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish the current package.json version even if its tag already exists"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      current: ${{ steps.version.outputs.current }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for version change
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          TAG="v$CURRENT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.force_publish }}" = "true" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG exists; forced publish requested, reusing it"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG already exists, skipping release"
            fi
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist, creating release"
          fi

      # Only on a genuinely new version. A forced re-publish reuses the existing
      # tag and release rather than trying to create one that is already there.
      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true' && steps.version.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.version.outputs.current }}"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --latest

  test:
    needs: release
    if: needs.release.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx vitest run

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # A job-level permissions block REPLACES the workflow-level one rather
      # than extending it, so `contents` has to be restated here. Without it
      # the SBOM upload gets "403 Resource not accessible by integration",
      # which is what stopped v1.1.0 from reaching npm.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 to exchange the Actions OIDC
      # token for a short-lived registry credential. Node 22 still bundles npm
      # 10.x, so without this the publish fails asking for auth that no longer
      # exists.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build

      # No NODE_AUTH_TOKEN. The package authenticates via GitHub's OIDC identity
      # (hence id-token: write above), which npm verifies against the trusted
      # publisher configured on the package. There is no long-lived secret to
      # expire -- the previous NPM_TOKEN silently expired on 17 July and nothing
      # noticed until a release tried to use it two months later.
      #
      # Publish first: attaching an SBOM is useful but it is not the release.
      # When the upload ran first, one 403 on a release asset meant the package
      # never reached npm at all while the tag and GitHub release still existed.
      - run: npm publish --provenance

      - name: Generate SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file bom.json
      - name: Upload SBOM to Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          gh release upload "$VERSION" bom.json --clobber

  publish-gpr:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the owner scope
        id: scope
        # GitHub Packages requires the package scope to match the repository
        # owner. This was hardcoded to @abdulmalikalayande and broke when the
        # repo moved to the TegoLabs org -- "403 permission_denied: The
        # requested installation does not exist". Deriving it from the
        # repository means a future transfer cannot break it again.
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@${{ steps.scope.outputs.owner }}"
      - run: npm ci
      - run: npm run build
      - name: Rewrite package name for GitHub Packages
        env:
          OWNER: ${{ steps.scope.outputs.owner }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@' + process.env.OWNER + '/sorokeep';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2), 'utf8');
          "
      # The npm registry publish is the one that matters; a GitHub Packages
      # failure should not mark the whole release failed after npm succeeded.
      - run: npm publish
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
